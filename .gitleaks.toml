# Gitleaks configuration for this repository: the default rules, plus one allowlist for the port's environment switch
# names. Code comments and docs name switches like KZ3_KB_PROMPTS_FLIP=N or LD_VTX_DEV=1, which the generic-api-key
# rule reads as a key assignment. Only lines whose match is such a switch name are allowed; every other finding still
# fails the scan. The same allowlist takes the made-up Sentry key of the crash-report host test
# (tools/release/test_crash_report.py, FAKE_DSN on example.invalid): sixteen hex digits counted up twice, no real key. [allowlist] (singular) is the form gitleaks 8.24 (the CI's pinned version) reads; [[allowlists]] needs 8.25+.
[extend]
useDefault = true

[allowlist]
description = "Port environment switch names (KZ3_*, LD_*, RSX_*, PAD_*, SPU_*, PPU_*) in comments and docs; the crash-report test's made-up key"
regexTarget = "match"
regexes = ['''\b(KZ3|LD|RSX|PAD|SPU|PPU|SPURS|GCM)_[A-Z0-9_]+\s*[=:]\s*[A-Za-z0-9_.,:-]{0,16}\b''',
           '''0123456789abcdef0123456789abcdef''']
