# GitHub Pages: publishes only site/ (the generated project page) and the screenshots it links, docs/screenshots/.
# Dormant until the maintainer sets the repository variable PAGES_ENABLED to "true" (Settings, Secrets and variables,
# Actions, Variables) and Settings, Pages, Source to "GitHub Actions": without the variable both jobs are skipped.
#
# Discussions board: the build asks GitHub's GraphQL API (with this job's own GITHUB_TOKEN, read-only) for the latest
# discussions and renders the site's Discussions section from them. WHAT GOES ONLINE: only the titles (capped), author
# logins, dates, reply counts and discussion links of four categories (Announcements, Game Requests, General, Q&A),
# published as static HTML on the project's own Pages site. Never a post body, avatar or image, no script, no embed.
# The token is read by tools/release/discussions_feed.py only, never printed and never handed to website.py.
# No snapshot (no token, API down) leaves the committed static page with plain links.
#
# Triggers: a push to main that touches site/ or docs/screenshots/, a new, edited, deleted or re-categorised discussion,
# a new or deleted comment, a daily run as the fallback, and workflow_dispatch. Bursts collapse to one build (concurrency).
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  discussion:
    types: [created, edited, deleted, category_changed]
  discussion_comment:
    types: [created, deleted]
  schedule:
    - cron: "23 4 * * *"   # daily fallback for missed events
  workflow_dispatch:

permissions: {}   # each job asks for what it needs

concurrency:
  group: pages
  cancel-in-progress: true   # a burst of events leaves one build: the newest

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: read         # actions/configure-pages reads the Pages site
      discussions: read   # the board snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Stage _site/
        run: |
          set -euo pipefail
          mkdir -p _site/site
          cp -a site/. _site/site/
          mkdir -p _site/docs && cp -a docs/screenshots _site/docs/screenshots
          touch _site/.nojekyll
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=site/"><title>Redirect</title><a href="site/">site/</a>' > _site/index.html
          test -s _site/site/index.html
      - name: Discussions board snapshot (optional, never fails the build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read by discussions_feed.py only
        run: |
          set -uo pipefail
          python3 tools/release/discussions_feed.py feed.json || true
      - name: Render the page with the snapshot
        run: |
          set -euo pipefail
          if [ -s feed.json ]; then
            python3 tools/release/website.py --feed feed.json --out _site/site/index.html
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    permissions:
      pages: write      # deploy-pages
      id-token: write   # deploy-pages verifies the artifact's origin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
