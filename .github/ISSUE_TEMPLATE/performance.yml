name: Performance report
description: Low frame rate, stutter or audio crackle in a specific place
labels: [performance, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        The levels run at roughly 15-20 frames/s today (the game's own speed is 30), so slow play is known. Reports that help: a place that is much slower than the rest, or a change between builds. Never attach game files.
  - type: textarea
    id: where
    attributes:
      label: What you see
      description: "What is on screen, the frame rate you see (the port logs it), stutter or steady slowness."
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game version
      options: ["1.14 (update installed)", "1.00 (disc only)", "Not sure"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port build
      description: "Release number, or the commit (`git rev-parse --short HEAD`) of the build you ran."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "OS (Windows version, or Linux distribution and Proton version), CPU, GPU and driver version."
    validations:
      required: true
  - type: input
    id: level
    attributes:
      label: Chapter or menu
      description: "Which chapter (for example Flooded Pyrrhus) or menu, and how long after the start."
  - type: input
    id: ram
    attributes:
      label: RAM and CPU threads
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: "Attach the newest file from `logs/` next to the exe (and the crash file there, if any). Before attaching, open the log and remove your Windows or Linux user name, home folder paths and any host name (search for your user name). Never attach game files, decrypted binaries, saves or keys."
